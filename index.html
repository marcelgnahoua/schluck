<style>
:root{
  /* Schluck online: the grey table and white tile path of the printed board, deck colours from the Canva board.
     One phone-width column: players strip, snake board (6 x 9), roll dock pinned to the bottom, each square opens a bottom sheet
     that every phone in the game sees at the same moment. */
  --ground:#74777D;
  --tile:#FFFFFF;
  --ink:#1F2228;
  --muted:#5B5F66;
  --line:#D5D7DB;
  --soft:#EEF0F2;
  --truth:#0D9488;
  --dare:#E11D48;
  --special:#F97316;
  --die:#16A34A;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background-color:var(--ground);background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.5px),radial-gradient(130% 70% at 50% 25%,#83868C 0%,#74777D 55%,#606369 100%);background-size:16px 16px,100% 100%;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.sheet :focus-visible,.panel :focus-visible,.dock :focus-visible{outline-color:var(--ink)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.logo{font-family:var(--display);font-size:28px;line-height:1;color:#FFFFFF;margin:0;text-shadow:1px 1px 0 #E5E7EB,2px 2px 0 #C8CBD1,3px 3px 0 #ADB0B6,5px 6px 8px rgba(0,0,0,.3)}
.pill{font-size:14px;font-weight:600;color:#FFFFFF;border:2px solid rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.code{font-family:var(--display);font-weight:400;letter-spacing:.08em;background:rgba(0,0,0,.18)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#FFFFFF;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.icon-btn svg .f{fill:currentColor;stroke:none}

.players{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.2);color:#FFFFFF;border-radius:999px;padding:5px 12px 5px 6px;font-size:16px;font-weight:500}
.pchip.now{background:#FFFFFF;color:var(--ink)}
.pchip.lvlchip{padding:5px 12px;background:rgba(225,29,72,.85);font-weight:600}
.pchip small{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #FFFFFF;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.banner{margin:0 16px 10px;background:rgba(0,0,0,.22);color:#FFFFFF;border-radius:12px;padding:8px 12px;font-size:15px}

.board-wrap{padding:2px 16px 20px;flex:1}
.board-stage{position:relative;margin:0 auto;isolation:isolate;pointer-events:none}
.board{position:relative;transform-origin:50% 100%;transform-style:preserve-3d}
.board .tile,.board .pile3{pointer-events:auto}
/* the logo plate printed in the middle of the square board */
.plate{position:absolute;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.plate svg{display:block;width:100%;height:100%}
.logo-c{position:absolute;pointer-events:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.logo-c svg{display:block;width:100%;height:100%}
.tile.end{justify-content:center;gap:4px}
/* table view: a three-quarter studio shot */
.board-wrap:has(.scene-stage){position:relative;overflow:clip;padding:6px 3px 26px;display:flex;flex-direction:column;justify-content:center}
.scene-stage{z-index:1;transform-origin:0 0}
.scene-stage.cam{transition:transform .55s cubic-bezier(.3,.7,.3,1)}
/* the room: party lights on a wire, coloured spots drifting over the table */
.decor{position:absolute;inset:0;pointer-events:none;z-index:0}
.decor .wire{position:absolute;left:0;top:0;width:100%;height:30px;overflow:visible}
.decor i{position:absolute;width:9px;height:13px;margin-left:-4.5px;border-radius:40% 40% 50% 50%/30% 30% 70% 70%;background:var(--c);box-shadow:0 0 6px 2px var(--c),0 0 18px 6px color-mix(in srgb,var(--c) 45%,transparent);animation:twinkle 2.2s ease-in-out infinite}
.decor i::before{content:"";position:absolute;left:2px;top:-3px;width:5px;height:4px;border-radius:1px;background:#3F3A48}
@keyframes twinkle{50%{opacity:.4}}
.spots{position:absolute;inset:0;pointer-events:none;z-index:2;mix-blend-mode:screen;overflow:hidden}
.spots i{position:absolute;width:75%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);opacity:.13;animation:sweep 11s ease-in-out infinite alternate}
@keyframes sweep{0%{transform:translate(0,0)}33%{transform:translate(45%,20%)}66%{transform:translate(10%,45%)}100%{transform:translate(55%,-10%)}}
.prop{position:absolute;left:0;top:0;transform-origin:50% 100%;pointer-events:none}
/* the throw */
.throw{position:fixed;left:0;top:0;z-index:12;pointer-events:none}
.throw .th-d,.throw .th-sh{position:absolute;left:0;top:0}
.throw .th-sh{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.65),rgba(0,0,0,0))}
.throw.gone{transition:opacity .3s ease;opacity:0}
/* steps and the landing */
.tile.step::before{content:"";position:absolute;inset:-2px;border-radius:inherit;border:2.5px solid var(--c);animation:stepring .5s ease-out forwards;pointer-events:none}
@keyframes stepring{from{opacity:.95;transform:scale(.92)}to{opacity:0;transform:scale(1.3)}}
.tile.land{animation:landpop .7s cubic-bezier(.2,.8,.3,1)}
@keyframes landpop{0%{transform:scale(1)}30%{transform:scale(1.22);box-shadow:0 0 0 3px #FFFFFF,0 0 0 7px var(--c),0 0 26px 8px var(--c)}65%{transform:scale(.95)}100%{transform:scale(1)}}
.burst{position:fixed;z-index:13;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #FFFFFF;animation:spark .8s cubic-bezier(.2,.7,.3,1) forwards}
.burst i:nth-child(3n){border-radius:2px;background:#FACC15}
.burst i:nth-child(4n){background:#FFFFFF;box-shadow:none}
@keyframes spark{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(var(--s)) rotate(160deg);opacity:0}}
.callout{position:absolute;left:0;bottom:16px;display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--c);color:#FFFFFF;font-family:var(--display);font-size:13px;letter-spacing:.02em;padding:5px 12px 5px 5px;border-radius:999px;border:2.5px solid #FFFFFF;box-shadow:0 8px 18px rgba(0,0,0,.4);animation:callout 1.5s cubic-bezier(.2,.8,.3,1) forwards}
.callout .ci{width:24px;height:24px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center}
.callout .ci svg{width:15px;height:15px;fill:none;stroke:var(--c);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.callout .ci svg .f{fill:var(--c);stroke:none}
@keyframes callout{0%{transform:translate(-50%,18px) scale(.3);opacity:0}16%{transform:translate(-50%,0) scale(1.1);opacity:1}28%{transform:translate(-50%,0) scale(1)}78%{transform:translate(-50%,-12px);opacity:1}100%{transform:translate(-50%,-26px);opacity:0}}

.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #9F1239}
.cta[disabled]{opacity:.5;cursor:default;transform:none}
.cta.dark{background:var(--ink);box-shadow:0 6px 0 #000000}
.fine{color:#FFFFFF;font-size:14px;opacity:.9;margin:0;text-align:center}
.code-big{font-family:var(--display);font-size:clamp(64px,22vw,96px);line-height:1;letter-spacing:.12em;color:#FFFFFF;text-shadow:1px 1px 0 #E5E7EB,2px 2px 0 #C8CBD1,3px 3px 0 #ADB0B6,6px 8px 10px rgba(0,0,0,.3);margin:4px 0 0}
.seats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.seats li{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:500;padding:8px 10px;border-radius:12px;background:var(--soft)}
.seats small{margin-left:auto;font-size:13px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:40;background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:12px;font-size:17px;font-weight:500;max-width:88%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.3);animation:fade .2s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* pawns: drawn pieces on their own layer so they can hop between squares */
.pawnlayer{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;transform-style:preserve-3d}
.pw{position:absolute;left:0;top:0;width:32px;height:43px;margin:-39px 0 0 -16px;transform-origin:50% 90%;transition:transform .16s cubic-bezier(.3,.7,.3,1)}
.pw .hopper{position:relative;width:32px;height:43px}
.pw svg.piece{display:block;width:32px;height:43px;overflow:visible;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pw.cur{z-index:5}
.pw.cur .hopper{transform:scale(1.22);transform-origin:50% 100%}
.pw.cur svg.piece{filter:drop-shadow(0 0 3px #FFFFFF) drop-shadow(0 0 6px var(--pc,#FFFFFF)) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.pw.hop .hopper{animation:hop .17s ease-out}
.pw.cur.hop .hopper{animation:hopcur .17s ease-out}
@keyframes hop{45%{transform:translateY(-13px)}}
@keyframes hopcur{0%{transform:scale(1.22)}45%{transform:translateY(-15px) scale(1.22)}100%{transform:scale(1.22)}}
.pw .badge{position:absolute;right:-6px;top:2px;width:14px;height:14px;border-radius:50%;background:#0D9488;border:2px solid #FFFFFF;display:grid;place-items:center}
.pw .badge svg{width:8px;height:8px;fill:none;stroke:#FFFFFF;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* 3D dice */
.cube-scene{width:var(--s);height:var(--s);perspective:calc(var(--s) * 6);flex:none}
.cube-tilt{width:100%;height:100%;position:relative;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(-22deg)}
.cube{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.cube.rolling{transition:transform .95s cubic-bezier(.15,.75,.25,1)}
.cf{position:absolute;inset:0;border-radius:18%;background:var(--df);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1),inset 0 -5px 9px rgba(0,0,0,.1);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cf i{display:block;width:70%;height:70%;border-radius:50%;place-self:center}
.cf i.on{background:var(--dp);box-shadow:inset 0 1px 1px rgba(0,0,0,.35)}
.cf.f1{transform:translateZ(calc(var(--s) / 2))}
.cf.f2{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.cf.f3{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
.cf.f4{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.cf.f5{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.cf.f6{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.sdie .cube-scene{margin:6px 0 10px}
.sdie .later,.sh-body>.later{animation:appear .3s .95s both}
@keyframes appear{from{opacity:0;transform:translateY(6px)}}

/* card deal + halo + chilis */
.card3d.deal{animation:deal .38s cubic-bezier(.2,.8,.25,1) both}
@keyframes deal{from{transform:translateY(110px) rotate(-12deg) scale(.5);opacity:0}}
.card3d .face{box-shadow:0 0 22px 3px var(--gl,transparent),0 8px 16px rgba(0,0,0,.18)}
.chili{display:inline-flex;gap:1px;vertical-align:-3px;margin-left:3px}
.chili svg{width:15px;height:15px}

/* big moments */
.sh-head .ic.pop{animation:pop .9s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
body.shake .app,body.shake .sheet{animation:shake .55s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.fx-stage{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:96px;position:relative}
.fx-stage svg{width:64px;height:88px;overflow:visible}
.glass-l{transform-origin:50% 100%;animation:clinkL .9s cubic-bezier(.3,1.4,.5,1) both}
.glass-r{transform-origin:50% 100%;animation:clinkR .9s cubic-bezier(.3,1.4,.5,1) both}
@keyframes clinkL{0%{transform:translateX(-46px) rotate(-28deg);opacity:0}55%{transform:translateX(6px) rotate(16deg);opacity:1}100%{transform:rotate(10deg)}}
@keyframes clinkR{0%{transform:translateX(46px) rotate(28deg);opacity:0}55%{transform:translateX(-6px) rotate(-16deg);opacity:1}100%{transform:rotate(-10deg)}}
.spark{position:absolute;top:2px;left:50%;width:56px;height:40px;margin-left:-28px;animation:spark .5s .5s ease-out both}
@keyframes spark{from{transform:scale(.2);opacity:0}60%{opacity:1}to{transform:scale(1.15);opacity:0}}
.shield-drop{display:flex;justify-content:center}
.shield-drop svg{width:86px;height:86px;animation:drop .8s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 6px 6px rgba(0,0,0,.2))}
@keyframes drop{from{transform:translateY(-90px) scale(1.5);opacity:0}}
.shot-row{display:flex;justify-content:center;gap:14px}
.shot-row svg{width:46px;height:60px;animation:slam .5s cubic-bezier(.3,1.6,.5,1) both}
.shot-row svg+svg{animation-delay:.15s}
@keyframes slam{from{transform:translateY(-60px) rotate(-14deg);opacity:0}}
.still .anim,.still .glass-l,.still .glass-r,.still .spark,.still .shield-drop svg,.still .shot-row svg,.still .card3d.deal,.still .later,.still .ic.pop{animation:none!important}
.still .spark{opacity:0}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;z-index:45;pointer-events:none}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function confetti(){
  if(reduced)return;
  const cv=document.createElement('canvas');cv.className='confetti';document.body.appendChild(cv);
  const dpr=Math.min(2,window.devicePixelRatio||1);const W0=innerWidth,H0=innerHeight;cv.width=W0*dpr;cv.height=H0*dpr;
  const cx=cv.getContext('2d');cx.scale(dpr,dpr);
  const cols=['#E11D48','#0D9488','#F97316','#16A34A','#FACC15','#3B82F6','#FFFFFF','#D99A00'];
  const ps=Array.from({length:150},function(){return {x:W0/2+(Math.random()-.5)*80,y:H0*0.35,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.35,w:6+Math.random()*7,h:4+Math.random()*5,c:cols[rnd(cols.length)]};});
  const t0=performance.now();
  (function frame(t){
    const el=t-t0;cx.clearRect(0,0,W0,H0);
    ps.forEach(function(p){p.vy+=0.32;p.vx*=0.992;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=Math.max(0,1-el/3200);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2)));cx.restore();});
    if(el<3200)requestAnimationFrame(frame);else cv.remove();
  })(t0);
}

/* ================= engine ================= */
function newGame(ids,names,level,extra,chars){
  const g={v:2,status:'play',level:level,order:ids.slice(),players:{},turn:0,boost:false,decks:{},rev:1,anim:null,sheet:null,note:null,winner:null};
  ids.forEach(function(id,i){g.players[id]={name:names[i],color:PCOLORS[i%PCOLORS.length],pos:1,safe:0,held:[],char:(chars&&typeof chars[i]==='number')?chars[i]:i%CHARS.length};});
  return Object.assign(g,extra||{});
}
function drawG(g,key,len){
  if(!g.decks[key]||!g.decks[key].length)g.decks[key]=shuffle(Array.from({length:len},function(_,i){return i;}));
  return g.decks[key].pop();
}
function actor(g){return g.order[g.turn];}
function eff(g,lower){let l=Math.min(3,g.level+(g.boost?1:0));if(lower)l=Math.max(1,l-1);return l;}
function landOn(g,id,to){
  g.players[id].pos=to;
  if(to>=LAST){g.status='win';g.winner=id;g.sheet={kind:'win',n:g.rev};return;}
  const key=BOARD[to-1];const s={kind:'square',pos:to,n:g.rev};
  if(key==='safe')g.players[id].safe+=1;
  if(key==='who')s.q=drawG(g,'who',WHO.length);
  g.sheet=s;
}
const A={
  roll:function(g){const id=actor(g);const v=1+rnd(6);const from=g.players[id].pos;const to=Math.min(LAST,from+v);g.anim={n:g.rev,kind:'roll',v:v,id:id,from:from,to:to};landOn(g,id,to);},
  move:function(g,steps){const id=actor(g);const from=g.players[id].pos;const to=Math.min(LAST,Math.max(1,from+steps));g.anim={n:g.rev,kind:'move',id:id,from:from,to:to};landOn(g,id,to);},
  tod:function(g,deck,lower){const l=eff(g,lower);const idx=drawG(g,deck+l,DECKS[deck].cards[l].length);g.boost=false;g.sheet={kind:'card',deck:deck,level:l,idx:idx,n:g.rev};},
  truth3:function(g){const idx=drawG(g,'truth3',DECKS.truth.cards[3].length);g.sheet={kind:'card',deck:'truth',level:3,idx:idx,n:g.rev};},
  special:function(g){const id=actor(g);const idx=drawG(g,'special',SPECIAL.length);const sc=SPECIAL[idx];
    if(sc.keep){if(sc.unique)g.order.forEach(function(o){g.players[o].held=g.players[o].held.filter(function(h){return h!==sc.n;});});g.players[id].held.push(sc.n);}
    if(sc.act==='boost')g.boost=true;
    g.sheet={kind:'special',idx:idx,n:g.rev};},
  sdie:function(g){g.sheet={kind:'sdie',pos:g.sheet?g.sheet.pos:0,face:1+rnd(6),n:g.rev};},
  next:function(g,text){g.sheet=null;g.turn=(g.turn+1)%g.order.length;if(text)g.note={n:g.rev,text:text};},
  safe:function(g){const p=g.players[actor(g)];p.safe=Math.max(0,p.safe-1);A.next(g,p.name+' used a safe token');},
  pass:function(g){A.next(g,g.players[actor(g)].name+' passes and drinks 2 sips');},
  swap:function(g,other){const a=g.players[actor(g)],b=g.players[other];if(!b)return;const t=a.pos;a.pos=b.pos;b.pos=t;A.next(g,a.name+' and '+b.name+' swapped places');},
  drop:function(g,id,i){const p=g.players[id];if(!p)return;const nm=p.held.splice(+i,1)[0];if(nm)g.note={n:g.rev,text:p.name+' used '+nm};},
  final:function(g){const l=eff(g,false);const idx=drawG(g,'dare'+l,DECKS.dare.cards[l].length);g.sheet={kind:'final',level:l,idx:idx,n:g.rev};},
  restart:function(g){g.order.forEach(function(id){const p=g.players[id];p.pos=1;p.safe=0;p.held=[];});g.status='play';g.turn=0;g.boost=false;g.sheet=null;g.anim=null;g.winner=null;g.note={n:g.rev,text:'New round. '+g.players[g.order[0]].name+' starts.'};},
  skip:function(g){A.next(g,g.players[actor(g)].name+"'s turn was skipped");}

function act(name){
  if(!G||busy||animating)return;
  const args=Array.prototype.slice.call(arguments,1);

async function commit(g){
  if(mode==='local'){lsSet(LOCAL_KEY,g);onState(g);return;}
  if(mode!=='online'||!db||!code)return;
  busy=true;paintControls();

    else if(e&&e.code==='unavailable'){try{await sleep(400+rnd(600));await db.doc('games/'+code).set(g);}catch(e2){toast("Your move didn't save. Check your connection and try again.");}}
    else toast("Your move didn't save. Check your connection and try again.");

}

function canAct(g){return mode==='local'||(!!me&&actor(g)===me);}

/* ================= state arrival + animation ================= */
function onState(g){
  if(firstState){firstState=false;seenAnim=g.anim?g.anim.n:0;seenNote=g.note?g.note.n:0;}
  if(animating){pendingState=g;G=G||g;return;}
  /* the same move confirmed a second time by the store: nothing new to draw (keeps dice and cards mid-animation) */
  if(G&&g.rev===G.rev&&g.status===G.status&&(g.sheet?g.sheet.n:0)===(G.sheet?G.sheet.n:0)){G=g;return;}
  if(g.anim&&g.anim.n>seenAnim){seenAnim=g.anim.n;G=g;runAnim(g);return;}
  G=g;paint();
}
async function runAnim(g){
  animating=true;closeSheet();
  const a=g.anim;
  displayPos={id:a.id,pos:a.from};
  paintGame();
  ensureVisible(a.from);
  if(a.kind==='roll'){
    await Promise.all([spinCube(document.querySelector('.roll .cube'),a.v),throwDie(a.v)]);
    say((g.players[a.id]?g.players[a.id].name:'Someone')+' rolled a '+a.v+'.');
    await sleep(reduced?0:420);
  }
  const dir=a.to>=a.from?1:-1;
  if(!reduced&&a.to!==a.from){
    const cam=is3D()&&!!SC;
    if(cam){camFollow(a.from);}dropThrown();await sleep(cam?480:120);
    for(let p=a.from;p!==a.to;){p+=dir;displayPos={id:a.id,pos:p};hopPawn(a.id,p);stepFx(p);if(cam)camFollow(p);await sleep(205);}
    landFx(a.to);await sleep(1000);
    if(cam){camReset();await sleep(520);}
  }
  dropThrown();
  displayPos=null;animating=false;
  const next=pendingState||g;pendingState=null;
  if(next.anim&&next.anim.n>seenAnim){seenAnim=next.anim.n;G=next;runAnim(next);return;}
  G=next;paint();
}

/* the die flies from the roll button onto the logo in the middle of the board, bounces twice and settles on v */
async function throwDie(v){
  if(reduced)return;
  const target=document.querySelector('.logo-c')||document.querySelector('.plate'),btn=document.querySelector('.roll');if(!target||!btn)return;
  const tr=target.getBoundingClientRect(),br=btn.getBoundingClientRect();

  const el=document.createElement('div');el.className='throw';el.setAttribute('aria-hidden','true');
  el.innerHTML='<span class="th-sh" style="width:'+Math.round(size*1.15)+'px;height:'+Math.round(size*.45)+'px"></span><span class="th-d">'+cubeHTML(v,size,'#FFFFFF','#1F2228')+'</span>';
  document.body.appendChild(el);thrown=el;
  const x0=br.left+br.width/2,y0=br.top+br.height/2,x1=tr.left+tr.width*.5,y1=tr.top+tr.height*.6;
  const A=[x1-tr.width*.18,y1+tr.height*.14],B=[x1-tr.width*.05,y1+tr.height*.03];
  const segs=[{u1:.56,a:[x0,y0],b:A,h:Math.min(200,Math.max(90,(y0-y1)*.6))},{u1:.79,a:A,b:B,h:Math.max(18,size*.8)},{u1:.92,a:B,b:[x1,y1],h:Math.max(6,size*.25)},{u1:1,a:[x1,y1],b:[x1,y1],h:0}];
  const kd=[],ks=[];const N=40;let u0=0,si=0;
  for(let i=0;i<=N;i++){const u=i/N;while(u>segs[si].u1&&si<segs.length-1){u0=segs[si].u1;si++;}
    const sg=segs[si],f=(u-u0)/(sg.u1-u0||1),gx=sg.a[0]+(sg.b[0]-sg.a[0])*f,gy=sg.a[1]+(sg.b[1]-sg.a[1])*f,hgt=4*sg.h*f*(1-f);
    const sc=si===0?1.3-.3*f:1;
    kd.push({offset:u,transform:'translate('+f1(gx-size/2)+'px,'+f1(gy-size/2-hgt)+'px) scale('+sc.toFixed(3)+')'});
    ks.push({offset:u,transform:'translate('+f1(gx-size*.575)+'px,'+f1(gy+size*.3)+'px) scale('+(1-Math.min(.55,hgt/240)).toFixed(3)+')',opacity:si===0&&f<.6?0:Math.max(.12,.6-hgt/220)});}
  el.querySelector('.th-d').animate(kd,{duration:1100,easing:'linear',fill:'forwards'});
  el.querySelector('.th-sh').animate(ks,{duration:1100,easing:'linear',fill:'forwards'});
  const cube=el.querySelector('.cube');cube.style.transform=rot(v,0);void cube.offsetWidth;cube.classList.add('rolling');cube.style.transform=rot(v,2);
  await sleep(1120);
}
function dropThrown(){if(!thrown)return;const el=thrown;thrown=null;el.classList.add('gone');setTimeout(function(){el.remove();},350);}
/* the camera leans in on the moving pawn (table view only), then pulls back */
function camFollow(n){
  if(reduced||!is3D()||!SC)return;
  const st=document.querySelector('.scene-stage');if(!st)return;
  const xy=pawnXY(n,0,1,SC.geo);const p=SC.cam.pr(xy.x,xy.y,SC.geo.t*.5);
  const px=p.x+SC.offX,py=p.y+SC.offY,W=st.offsetWidth,H=st.offsetHeight;
  const k=Math.max(1.5,Math.min(2.3,66/SC.geo.t));

}

/* a square answers the step on it with a ripple; the landing square pops, sparks fly and its name rises */
function stepFx(n){if(reduced)return;const tile=document.querySelector('.tile[data-arg="'+n+'"]');if(!tile)return;tile.classList.remove('step');void tile.offsetWidth;tile.classList.add('step');setTimeout(function(){tile.classList.remove('step');},500);}

/* the dealt card flies from its deck into the sheet; resolves when it has landed */

function is3D(){return !ui.flat;}

const GRID=8;
const SPIRAL=(function(){
  const used=[];for(let r=0;r<GRID;r++){used.push([]);for(let c=0;c<GRID;c++)used[r].push(-1);}
  const cells=[];let r=0,c=0,dr=0,dc=1;
  for(let i=0;i<LAST;i++){cells.push({r:r,c:c,h:1});used[r][c]=i;
    let nr=r+dr,nc=c+dc;
    if(nr<0||nr>=GRID||nc<0||nc>=GRID||used[nr][nc]>=0){const t=dr;dr=dc;dc=-t;nr=r+dr;nc=c+dc;}
    r=nr;c=nc;}
  const end=cells[LAST-1];

const CAM={tilt:0,yaw:45,lens:2.6};   /* lens: viewing distance in board diagonals (long lens = gentle perspective) */

function makeCam(geo){
  const a=CAM.tilt*Math.PI/180,b=CAM.yaw*Math.PI/180;

function fitScene(){

    const xs=p.map(function(q){return q.x;}),ys=p.map(function(q){return q.y;});

function affine(p00,p10,p01,w,h){return 'matrix('+[(p10.x-p00.x)/w,(p10.y-p00.y)/w,(p01.x-p00.x)/h,(p01.y-p00.y)/h,p00.x,p00.y].map(function(v){return v.toFixed(4);}).join(' ')+')';}
function dim(br,w,h){return br<0.995?'<rect width="'+f1(w)+'" height="'+f1(h)+'" fill="#000000" opacity="'+Math.min(.7,1-br).toFixed(3)+'"/>':'';}
/* a cuboid: o = {cx,cy,w,d,h,h0,r}; faces = {top:fn(w,d)|colour, side colours or fns} */
function cuboid(o,cam,sk){
  const r=(o.r||0)*Math.PI/180,cr=Math.cos(r),sr=Math.sin(r),w=o.w/2,d=o.d/2,top=o.h0+o.h;
  function P(lx,ly,h){const q=rot2(o,lx,ly);return cam.pr(q[0],q[1],h);}
  function N(nx,ny){return [cr*nx-sr*ny,sr*nx+cr*ny];}
  const faces=[
    {k:'front',n:N(0,1),c:[P(-w,d,top),P(w,d,top),P(-w,d,o.h0),P(w,d,o.h0)],cx:0,cy:d,W:o.w,H:o.h},
    {k:'back',n:N(0,-1),c:[P(w,-d,top),P(-w,-d,top),P(w,-d,o.h0),P(-w,-d,o.h0)],cx:0,cy:-d,W:o.w,H:o.h},
    {k:'right',n:N(1,0),c:[P(w,d,top),P(w,-d,top),P(w,d,o.h0),P(w,-d,o.h0)],cx:w,cy:0,W:o.d,H:o.h},
    {k:'left',n:N(-1,0),c:[P(-w,-d,top),P(-w,d,top),P(-w,-d,o.h0),P(-w,d,o.h0)],cx:-w,cy:0,W:o.d,H:o.h}];
  let h='';
  faces.forEach(function(f){
    const q=rot2(o,f.cx,f.cy);if(!cam.sees(f.n[0],f.n[1],0,q[0],q[1],o.h0+o.h/2))return;
    const br=cam.lit(f.n[0],f.n[1],0);const paint=sk[f.k]||sk.side;
    if(typeof paint==='function')h+='<g transform="'+affine(f.c[0],f.c[1],f.c[2],f.W,f.H)+'">'+paint(f.W,f.H)+dim(br,f.W,f.H)+'</g>';
    else h+='<polygon points="'+poly([f.c[0],f.c[1],f.c[3],f.c[2]])+'" fill="'+shade(paint,Math.max(-.6,br-1))+'"/>';
  });
  const t0=P(-w,-d,top),t1=P(w,-d,top),t2=P(w,d,top),t3=P(-w,d,top);
  if(typeof sk.top==='function')h+='<g class="'+(sk.topClass||'')+'"><g transform="'+affine(t0,t1,t3,o.w,o.d)+'">'+sk.top(o.w,o.d)+'</g></g>';
  else h+='<polygon points="'+poly([t0,t1,t2,t3])+'" fill="'+sk.top+'"/>';
  return h;
}

/* the flat lay: the board turned into a diamond, seen straight from above, things scattered around it.
   Offsets are given in screen terms (x right, y down, in squares) and turned into board coordinates. */
function atScreen(geo,sx,sy){const a=CAM.yaw*Math.PI/180,t=geo.t,dx=sx*t,dy=sy*t;return [geo.w/2+Math.cos(a)*dx+Math.sin(a)*dy,geo.h/2-Math.sin(a)*dx+Math.cos(a)*dy];}
function place(geo,sx,sy,rho,o){const p=atScreen(geo,sx,sy);o.cx=p[0];o.cy=p[1];o.r=rho-CAM.yaw;return o;}
function sceneGeo(t){
  const g=Math.max(2,Math.round(t*.12)),gy=g;
  const geo={cols:GRID,rows:GRID,g:g,gy:gy,t:t,w:GRID*t+(GRID-1)*g,h:GRID*t+(GRID-1)*g,pad:Math.round(t*.34),th:Math.max(4,Math.round(t*.16))};
  const th=geo.th;
  /* only what the game uses: the three decks and the Special Die, lined up along the two lower edges of the board.
     Seen as a diamond, the bottom side and the right side mirror each other. */
  const W=geo.w,H=geo.h,pad=geo.pad,gap=.22*t;
  const yb=H+pad+gap+.8*t,xr=W+pad+gap+.8*t;
  geo.decks=[{key:'truth',cx:W*.5,cy:yb,r:0},{key:'dare',cx:W*.84,cy:yb,r:0},{key:'special',cx:xr,cy:W*.5,r:-90}];
  geo.decks.forEach(function(d){d.w=1.15*t;d.d=1.6*t;d.h=.26*t;d.h0=-th;});
  geo.die={cx:xr-.45*t,cy:W*.84,w:.8*t,d:.8*t,h:.8*t,h0:-th,r:-45};
  geo.cards=[];geo.loose=[];geo.die2=null;geo.box=null;
  geo.drinks=[place(geo,5.25,-2.6,0,{k:'cocktail',w:1.5*t,d:1.5*t,h:.9*t}),place(geo,-5.25,-2.6,0,{k:'cocktail',w:1.5*t,d:1.5*t,h:.9*t})];
  return geo;
}
/* the points the camera must keep in frame: the board (with room for a standing pawn), the decks, the die and the rule cards */
function scenePoints(geo,cam){
  const pts=[],pad=geo.pad,th=geo.th,t=geo.t;
  [[-pad,-pad],[geo.w+pad,-pad],[geo.w+pad,geo.h+pad],[-pad,geo.h+pad]].forEach(function(c){const p=cam.pr(c[0],c[1],0);pts.push(p,{x:p.x,y:p.y-.8*t});});
  [geo.die].concat(geo.decks).forEach(function(o){boxCorners(o).forEach(function(c){pts.push(cam.pr(c[0],c[1],o.h0),cam.pr(c[0],c[1],o.h0+o.h));});});
  return pts;
}

/* ================= online plumbing ================= */
function stopOnline(){
  if(unsubGame){unsubGame();unsubGame=null;}
  if(unsubSeats){unsubSeats();unsubSeats=null;}
  clearTimeout(loadTimer);seats=[];
}
function enterOnline(c){
  stopOnline();
  mode='online';code=c;G=null;firstState=true;seenSheet=0;sheetKey='';
  lsSet(ONLINE_KEY,{code:c});
  renderLoading();
  loadTimer=setTimeout(function(){const m=document.getElementById('load-msg');if(m)m.textContent="Can't reach the game yet. Check your connection; it will load as soon as it can.";},10000);
  const ref=db.doc('games/'+c);
  unsubGame=ref.onSnapshot(function(snap){
    if(!snap.metadata.fromCache)clearTimeout(loadTimer);
    if(!snap.exists){if(!snap.metadata.fromCache){toast('Game '+c+' no longer exists.');leave();}return;}
    onState(snap.data());
  },function(err){
    clearTimeout(loadTimer);
    const m=document.getElementById('load-msg');
    if(m)m.textContent=err&&err.code==='revoked'?'Access to this page changed. Reopen it to keep playing.':"Lost the connection to the game. Reopen the page to reconnect.";
    else toast("Lost the connection to the game. Reopen the page to reconnect.");
  });
  unsubSeats=ref.collection('seats').onSnapshot(function(qs){
    seats=qs.docs.map(function(d){const x=d.data()||{};return {id:d.id,name:x.name,joined:x.joined,char:x.char};});
    if(G&&G.status==='lobby'&&!animating)renderLobby();
  },function(){});
}
function leave(){
  stopOnline();lsSet(ONLINE_KEY,null);
  mode=null;code=null;G=null;closeSheet();closeMenu();ui.msg='';
  renderHome();
}
function nick(){const n=String(ui.nick||'').trim();return n||'Player';}
async function createGame(){
  if(!db||!me||busy)return;
  busy=true;ui.msg='Creating the game…';ui.msgOk=true;renderHome();
  try{
    let c=genCode();
    for(let i=0;i<6;i++){const s=await db.doc('games/'+c).get();if(!s.exists)break;c=genCode();}
    const g={v:2,code:c,host:me,status:'lobby',level:ui.level,order:[],players:{},turn:0,boost:false,decks:{},rev:1,anim:null,sheet:null,note:null,winner:null,created:Date.now()};
    await db.doc('games/'+c).set(g);
    await db.doc('games/'+c+'/seats/'+me).set({name:nick(),joined:Date.now(),char:ui.char});
    busy=false;ui.msg='';enterOnline(c);
  }catch(e){
    busy=false;ui.msgOk=false;
    ui.msg=e&&e.code==='invalid_argument'?"Couldn't create the game: you need Editor access to this page.":"Couldn't create the game. Check your connection and try again.";
    renderHome();
  }
}
async function joinGame(){
  if(!db||!me||busy)return;
  const c=String(ui.joinCode||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4){ui.msg='Type the 4-letter code your host sees.';ui.msgOk=false;renderHome();return;}
  busy=true;ui.msg='Looking for game '+c+'…';ui.msgOk=true;renderHome();
  try{
    const s=await db.doc('games/'+c).get();
    if(!s.exists){busy=false;ui.msg='No game found with code '+c+'.';ui.msgOk=false;renderHome();return;}
    const g=s.data();
    if(g.status==='lobby'){
      try{await db.doc('games/'+c+'/seats/'+me).set({name:nick(),joined:Date.now(),char:ui.char});}
      catch(e){toast(e&&e.code==='invalid_argument'?"You can watch, but you need Editor access to this page to play.":"Couldn't take a seat. You're watching for now.");}
    }else if(!(g.players&&g.players[me])){toast('This game already started. You can watch, and play from the next round.');}
    busy=false;ui.msg='';enterOnline(c);
  }catch(e){busy=false;ui.msg="Couldn't reach game "+c+'. Check your connection and try again.';ui.msgOk=false;renderHome();}
}
function startOnline(){
  if(!G||G.host!==me||busy)return;
  const list=seats.slice().sort(function(a,b){return (a.joined||0)-(b.joined||0);}).slice(0,10);
  if(list.length<2)return;
  const g=newGame(list.map(function(s){return s.id;}),list.map(function(s){return String(s.name||'Player').slice(0,16);}),G.level,
    {code:G.code,host:G.host,created:G.created,rev:(G.rev||0)+1},list.map(function(s,i){return typeof s.char==='number'?s.char%CHARS.length:i%CHARS.length;}));
  g.note={n:g.rev,text:"Let's go! "+g.players[g.order[0]].name+' starts.'};
  commit(g);
}
async function backToLobby(){
  if(!G||G.host!==me)return;
  const g=clone(G);g.rev=(g.rev||0)+1;g.status='lobby';g.sheet=null;g.anim=null;g.winner=null;g.order=[];g.players={};
  await commit(g);
  try{await db.doc('games/'+code+'/seats/'+me).set({name:nick(),joined:Date.now(),char:ui.char});}catch(e){}
}

  const k=a.dataset.act,arg=a.dataset.arg;
  switch(k){
    case 'olvl':ui.level=+arg;renderHome();break;
    case 'create':createGame();break;
    case 'join':joinGame();break;
    case 'local-setup':{
      const wasLocal=mode==='local'&&G&&G.order;
      if(wasLocal){ui.draft.names=G.order.map(function(id){return G.players[id].name;});ui.draft.chars=G.order.map(function(id,i){return charOf(G.players[id],i);});ui.draft.level=G.level;}
      closeMenu();closeSheet();if(mode==='online')leave();
      mode='local';ui.screen='local-setup';G=null;renderLocalSetup();break;}
    case 'continue-local':{const g=lsGet(LOCAL_KEY);if(!g)break;mode='local';ui.screen='game';G=null;firstState=true;sheetKey='';onState(g);break;}
    case 'llvl':ui.draft.level=+arg;renderLocalSetup();break;
    case 'char':{const i=+arg;ui.draft.chars=ui.draft.chars||ui.draft.names.map(function(_,k){return k%CHARS.length;});let nx=ui.draft.chars[i]||0;for(let k=0;k<CHARS.length;k++){nx=(nx+1)%CHARS.length;if(ui.draft.chars.indexOf(nx)<0||ui.draft.chars.indexOf(nx)===i)break;}ui.draft.chars[i]=nx;renderLocalSetup();const b=document.querySelector('[data-act=char][data-arg="'+i+'"]');if(b)b.focus();break;}
    case 'pickchar':ui.char=+arg;lsSet('schluck-char',ui.char);renderHome();break;
    case 'add':{const cs=(ui.draft.chars=ui.draft.chars||ui.draft.names.map(function(_,k){return k%CHARS.length;}));let f=0;while(cs.indexOf(f)>=0&&f<CHARS.length-1)f++;cs.push(f);}ui.draft.names.push('Player '+(ui.draft.names.length+1));renderLocalSetup();{const ins=document.querySelectorAll('.prow input');ins[ins.length-1].focus();}break;
    case 'rm':ui.draft.names.splice(+arg,1);if(ui.draft.chars)ui.draft.chars.splice(+arg,1);renderLocalSetup();break;
    case 'start-local':{
      const names=ui.draft.names.map(function(n,i){n=String(n).trim();return n||('Player '+(i+1));});
      const g=newGame(names.map(function(_,i){return 'p'+i;}),names,ui.draft.level,{mode:'local'},ui.draft.chars);
      g.note={n:1,text:names[0]+' starts.'};
      mode='local';ui.screen='game';firstState=false;seenNote=0;seenAnim=0;seenSheet=0;sheetKey='';
      lsSet(LOCAL_KEY,g);G=g;paint();break;}
    case 'home':closeMenu();closeSheet();if(mode==='online'){leave();break;}mode=null;G=null;ui.screen='home';renderHome();break;
    case 'leave':closeMenu();leave();break;
    case 'start-online':startOnline();break;
    case 'relobby':closeMenu();backToLobby();break;
    case 'menu':showMenu();break;
    case 'legend':showLegend();break;
    case 'view':ui.flat=!ui.flat;lsSet('schluck-flat',ui.flat||null);closeMenu();refreshBoard();break;
    case 'pile':{const d=DECKS[arg];toast(d.name.charAt(0)+d.name.slice(1).toLowerCase()+' cards: '+(a.getAttribute('aria-label')||'').split(': ')[1]+(arg==='special'?'':' at this level'));break;}
    case 'closemenu':closeMenu();break;
    case 'tile':{const n=+arg;toast('Square '+n+' · '+TYPES[BOARD[n-1]].label);break;}
    case 'roll':act('roll');break;
    case 'next':act('next');break;
    case 'pass':act('pass');break;
    case 'usesafe':act('safe');break;
    case 'tod':{const l=document.getElementById('lower');act('tod',arg,!!(l&&l.checked));break;}
    case 'truth3':act('truth3');break;
    case 'sdraw':act('special');break;
    case 'sroll':act('sdie');break;
    case 'jump':act('move',+arg);break;
    case 'back3':act('move',-3);break;
    case 'swap':act('swap',arg);break;
    case 'drop':act('drop',a.dataset.id,arg);break;
    case 'final':act('final');break;
    case 'restart':closeMenu();act('restart');break;
    case 'skip':closeMenu();act('skip');break;
  }
});
window.addEventListener('resize',function(){if(G&&G.status!=='lobby'&&mode)refreshBoard();});

/* ================= boot ================= */
async function connect(){
  if(!(window.claude&&window.claude.use)){platform='off';if(mode===null)renderHome();return;}
  try{
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    db=res[0];user=res[1];
    if(user){me=await user.id();try{canWrite=await user.can('data.write');}catch(e){canWrite=null;}
      if(!ui.nick){try{const m=await user.me();if(m&&m.name){ui.nick=m.name.split(' ')[0].slice(0,16);}}catch(e){}}}
    platform=db?'on':'off';
  }catch(e){platform='off';}
  const saved=lsGet(ONLINE_KEY);
  if(platform==='on'&&me&&saved&&saved.code&&mode===null){enterOnline(saved.code);return;}
  if(mode===null)renderHome();
}
function start(data){
  if(data&&data.mode==='local'&&data.local){mode='local';ui.screen='game';G=null;firstState=true;onState(data.local);}
  else renderHome();
  if(PORTABLE){if(FIREBASE_URL)fbConnect();else platform='off';return;}
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {mode:mode,local:mode==='local'?G:null};});}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>

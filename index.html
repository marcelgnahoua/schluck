<style>
:root{
  /* Schluck online: the grey table and white tile path of the printed board, deck colours from the Canva board.
     One phone-width column: players strip, snake board (6 x 9), roll dock pinned to the bottom, each square opens a bottom sheet
     that every phone in the game sees at the same moment. */
  --ground:#74777D;
  --tile:#FFFFFF;
  --ink:#1F2228;
  --muted:#5B5F66;
  --line:#D5D7DB;
  --soft:#EEF0F2;
  --truth:#0D9488;
  --dare:#E11D48;
  --special:#F97316;
  --die:#16A34A;
  --display:'Bungee','Arial Black',Impact,sans-serif;
  --body:'Oswald','Arial Narrow','Roboto Condensed',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.sheet :focus-visible,.panel :focus-visible,.dock :focus-visible{outline-color:var(--ink)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

.top{display:flex;align-items:center;gap:8px;padding:14px 16px 8px}
.logo{font-family:var(--display);font-size:28px;line-height:1;color:#FFFFFF;margin:0;text-shadow:1px 1px 0 #E5E7EB,2px 2px 0 #C8CBD1,3px 3px 0 #ADB0B6,5px 6px 8px rgba(0,0,0,.3)}
.pill{font-size:14px;font-weight:600;color:#FFFFFF;border:2px solid rgba(255,255,255,.75);border-radius:999px;padding:4px 10px;white-space:nowrap}
.pill.code{font-family:var(--display);font-weight:400;letter-spacing:.08em;background:rgba(0,0,0,.18)}
.spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#FFFFFF;display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

.players{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}
.players::-webkit-scrollbar{display:none}
.pchip{flex:none;display:flex;align-items:center;gap:7px;background:rgba(0,0,0,.2);color:#FFFFFF;border-radius:999px;padding:5px 12px 5px 6px;font-size:16px;font-weight:500}
.pchip.now{background:#FFFFFF;color:var(--ink)}
.pchip small{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid #FFFFFF;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.banner{margin:0 16px 10px;background:rgba(0,0,0,.22);color:#FFFFFF;border-radius:12px;padding:8px 12px;font-size:15px}

.board-wrap{padding:2px 16px 20px;flex:1}
.board{position:relative;margin:0 auto}
.board svg.path{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.tile{position:absolute;background:var(--tile);border:0;border-top:4px solid var(--c);border-radius:10px;box-shadow:0 4px 0 #A9ACB2;padding:0 0 12px;display:flex;align-items:center;justify-content:center}
.tile .n{position:absolute;top:1px;left:5px;font-size:10px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tile.here{box-shadow:0 4px 0 #A9ACB2,0 0 0 3px #FFFFFF,0 0 0 6px var(--pc)}
.ic{border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.ic svg{fill:none;stroke:#FFFFFF;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ic svg .f{fill:#FFFFFF;stroke:none}
.tile .ic{width:26px;height:26px}
.tile .ic svg{width:16px;height:16px}
.pawns{position:absolute;left:2px;right:2px;bottom:2px;display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.pawn{width:12px;height:12px;border-radius:50%;border:2px solid #FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.45)}

.dock{position:sticky;bottom:0;z-index:5;background:#FFFFFF;border-radius:22px 22px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;box-shadow:0 -6px 22px rgba(0,0,0,.2)}
.now-info{flex:1;min-width:0}
.now-name{display:flex;align-items:center;gap:8px;font-size:25px;font-weight:600;line-height:1.05}
.now-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-where{font-size:15px;color:var(--muted);margin-top:3px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;background:var(--soft);color:var(--ink)}
.chip.safe{background:#CCFBF1;color:#115E59}
.chip.held{background:#FFEDD5;color:#9A3412}
.mine-row{font-size:13px;color:var(--muted);margin-top:8px}
.roll{flex:none;width:100px;height:100px;border-radius:22px;border:0;background:var(--ink);color:#FFFFFF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 5px 0 #000000;transition:transform .08s}
.roll:active{transform:translateY(3px);box-shadow:0 2px 0 #000000}
.roll[disabled]{opacity:.5;cursor:default;transform:none;box-shadow:0 5px 0 #000000}
.roll .lbl{font-family:var(--display);font-size:14px;letter-spacing:.04em}
.die{width:54px;height:54px;background:#FFFFFF;border-radius:12px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:7px}
.die i{display:block;width:10px;height:10px;border-radius:50%;place-self:center}
.die i.on{background:var(--ink)}
.die.spin{animation:spin .5s cubic-bezier(.2,.8,.3,1)}
@keyframes spin{from{transform:rotate(-220deg) scale(.6)}to{transform:none}}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(18,20,24,.55);display:flex;align-items:flex-end;justify-content:center}
.scrim.fresh{animation:fade .2s ease-out}
.scrim.fresh .sheet{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.scrim.menu{z-index:30}
.sheet{width:100%;max-width:520px;max-height:90%;overflow:auto;background:#FFFFFF;border-radius:24px 24px 0 0}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sh-head{background:var(--c);color:var(--k);padding:18px 20px 16px;display:flex;align-items:center;gap:14px}
.sh-head .ic{width:46px;height:46px;background:#FFFFFF}
.sh-head .ic svg{width:26px;height:26px;stroke:var(--c)}
.sh-head .ic svg .f{fill:var(--c)}
.sh-title{font-family:var(--display);font-weight:400;font-size:24px;line-height:1.05;margin:0;text-wrap:balance}
.sh-sub{font-size:15px;font-weight:500;margin-top:3px;opacity:.92}
.sh-body{padding:18px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
.lead{font-size:21px;font-weight:500;line-height:1.35;margin:0}
.note{font-size:15px;color:var(--muted);margin:0;line-height:1.4}
.wait{margin:0;padding:14px 16px;border-radius:14px;background:var(--soft);font-size:17px;font-weight:500;color:var(--muted);text-align:center}
.big-q{font-size:26px;font-weight:600;line-height:1.25;margin:0;text-wrap:balance}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;min-height:54px;border-radius:14px;border:0;padding:10px 16px;font-size:18px;font-weight:600;background:var(--ink);color:#FFFFFF}
.btn.alt{background:var(--soft);color:var(--ink)}

.cf-text .fx{font-size:18px;font-weight:500;line-height:1.3}

summary{font-size:18px;font-weight:600;padding:12px 0;cursor:pointer}
details ol{margin:0 0 14px;padding-left:20px;font-size:16px;line-height:1.5}

  g.sheet=s;
}
const A={
  roll:function(g){const id=actor(g);const v=1+rnd(6);const from=g.players[id].pos;const to=Math.min(LAST,from+v);g.anim={n:g.rev,kind:'roll',v:v,id:id,from:from,to:to};landOn(g,id,to);},
  move:function(g,steps){const id=actor(g);const from=g.players[id].pos;const to=Math.min(LAST,Math.max(1,from+steps));g.anim={n:g.rev,kind:'move',id:id,from:from,to:to};landOn(g,id,to);},
  tod:function(g,deck,lower){const l=eff(g,lower);const idx=drawG(g,deck+l,DECKS[deck].cards[l].length);g.boost=false;g.sheet={kind:'card',deck:deck,level:l,idx:idx,n:g.rev};},
  truth3:function(g){const idx=drawG(g,'truth3',DECKS.truth.cards[3].length);g.sheet={kind:'card',deck:'truth',level:3,idx:idx,n:g.rev};},
  special:function(g){const id=actor(g);const idx=drawG(g,'special',SPECIAL.length);const sc=SPECIAL[idx];
    if(sc.keep){if(sc.unique)g.order.forEach(function(o){g.players[o].held=g.players[o].held.filter(function(h){return h!==sc.n;});});g.players[id].held.push(sc.n);}
    if(sc.act==='boost')g.boost=true;
    g.sheet={kind:'special',idx:idx,n:g.rev};},
  sdie:function(g){g.sheet={kind:'sdie',pos:g.sheet?g.sheet.pos:0,face:1+rnd(6),n:g.rev};},
  next:function(g,text){g.sheet=null;g.turn=(g.turn+1)%g.order.length;if(text)g.note={n:g.rev,text:text};},
  safe:function(g){const p=g.players[actor(g)];p.safe=Math.max(0,p.safe-1);A.next(g,p.name+' used a safe token');},
  pass:function(g){A.next(g,g.players[actor(g)].name+' passes and drinks 2 sips');},
  swap:function(g,other){const a=g.players[actor(g)],b=g.players[other];if(!b)return;const t=a.pos;a.pos=b.pos;b.pos=t;A.next(g,a.name+' and '+b.name+' swapped places');},
  drop:function(g,id,i){const p=g.players[id];if(!p)return;const nm=p.held.splice(+i,1)[0];if(nm)g.note={n:g.rev,text:p.name+' used '+nm};},
  final:function(g){const l=eff(g,false);const idx=drawG(g,'dare'+l,DECKS.dare.cards[l].length);g.sheet={kind:'final',level:l,idx:idx,n:g.rev};},
  restart:function(g){g.order.forEach(function(id){const p=g.players[id];p.pos=1;p.safe=0;p.held=[];});g.status='play';g.turn=0;g.boost=false;g.sheet=null;g.anim=null;g.winner=null;g.note={n:g.rev,text:'New round. '+g.players[g.order[0]].name+' starts.'};},
  skip:function(g){A.next(g,g.players[actor(g)].name+"'s turn was skipped");}
};
function act(name){
  if(!G||busy||animating)return;
  const args=Array.prototype.slice.call(arguments,1);
  const g=clone(G);g.rev=(g.rev||0)+1;
  A[name].apply(null,[g].concat(args));
  commit(g);
}
async function commit(g){
  if(mode==='local'){lsSet(LOCAL_KEY,g);onState(g);return;}
  if(mode!=='online'||!db||!code)return;
  busy=true;paintControls();
  try{await db.doc('games/'+code).set(g);}
  catch(e){
    if(e&&e.code==='invalid_argument')toast("Your move didn't save: you need Editor access to this page to play.");
    else if(e&&e.code==='unavailable'){try{await sleep(400+rnd(600));await db.doc('games/'+code).set(g);}catch(e2){toast("Your move didn't save. Check your connection and try again.");}}
    else toast("Your move didn't save. Check your connection and try again.");
  }
  busy=false;paintControls();
}

/* who may press what */

function canAct(g){return mode==='local'||(!!me&&actor(g)===me);}
function canHost(g){return mode==='local'||(!!me&&g.host===me);}

/* ================= state arrival + animation ================= */
function onState(g){
  if(firstState){firstState=false;seenAnim=g.anim?g.anim.n:0;seenNote=g.note?g.note.n:0;}
  if(animating){pendingState=g;G=G||g;return;}
  if(g.anim&&g.anim.n>seenAnim){seenAnim=g.anim.n;G=g;runAnim(g);return;}
  G=g;paint();
}
async function runAnim(g){
  animating=true;closeSheet();
  const a=g.anim;
  displayPos={id:a.id,pos:a.from};
  paintGame();
  if(a.kind==='roll'){
    const dock=document.querySelector('.roll .die');
    if(!reduced&&dock){for(let k=0;k<8;k++){const d=document.querySelector('.roll .die');if(d)d.outerHTML=dieHTML(1+rnd(6),'spin');await sleep(65);}}
    const d=document.querySelector('.roll .die');if(d)d.outerHTML=dieHTML(a.v,'spin');
    say((g.players[a.id]?g.players[a.id].name:'Someone')+' rolled a '+a.v+'.');
    await sleep(reduced?0:300);
  }
  const dir=a.to>=a.from?1:-1;
  if(!reduced){
    for(let p=a.from;p!==a.to;){p+=dir;displayPos={id:a.id,pos:p};refreshBoard();await sleep(170);}
  }
  displayPos=null;animating=false;
  const next=pendingState||g;pendingState=null;
  if(next.anim&&next.anim.n>seenAnim){seenAnim=next.anim.n;G=next;runAnim(next);return;}
  G=next;paint();
}

  paintGame();

}

function geometry(){
  const w=Math.min(document.documentElement.clientWidth||360,520)-32;
  const g=6;const t=Math.floor((w-5*g)/6);
  return {g:g,t:t,w:6*t+5*g,h:9*t+8*g};
}
function tilePos(i,geo){const row=Math.floor(i/6);const k=i%6;const col=row%2===0?k:5-k;return {x:col*(geo.t+geo.g),y:row*(geo.t+geo.g)};}
function posOf(id){return displayPos&&displayPos.id===id?displayPos.pos:G.players[id].pos;}
function boardHTML(){
  const geo=geometry();const cid=actor(G);const cp=G.players[cid];
  let pts='';for(let i=0;i<LAST;i++){const q=tilePos(i,geo);pts+=(q.x+geo.t/2)+','+(q.y+geo.t/2)+' ';}
  const sw=Math.round(geo.t*.42);

    '<polyline points="'+pts+'" fill="none" stroke="#A9ACB2" stroke-width="'+sw+'" stroke-linejoin="round" stroke-linecap="round" transform="translate(0 4)"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="#FFFFFF" stroke-width="'+sw+'" stroke-linejoin="round" stroke-linecap="round"/></svg>';
  for(let i=0;i<LAST;i++){

      '<span class="n">'+n+'</span><span class="ic">'+svg(ty.icon)+'</span>'+(pawns?'<span class="pawns">'+pawns+'</span>':'')+'</button>';

  if(s.kind==='special'){
    const sc=SPECIAL[s.idx];let actions;
    if(sc.act==='swap'){
      if(mine){let pick='';g.order.forEach(function(o){if(o!==id){const q=g.players[o];pick+=B('swap','<span class="dot" style="background:'+q.color+'"></span>'+esc(q.name)+' (#'+q.pos+')','',o);}});actions='<p class="note">Swap with:</p><div class="pick">'+pick+'</div>';}
      else actions=wait;
    }else if(sc.act==='back3'){actions=mine?'<div class="btns">'+B('back3','Move back 3')+'</div>':wait;}
    else actions=nextB();
    return {c:DECKS.special.c,k:W,icon:'star',title:'Special card',sub:p.name+(sc.keep?' · keeps this card':''),flip:true,isNew:isNew,
      body:cardHTML('special',0,'<span class="nm">'+esc(sc.n)+'</span><span class="fx">'+esc(sc.t)+'</span>',sc.keep?'Keep this card':'',!isNew)+actions,say:sc.n+'. '+sc.t};
  }
  if(s.kind==='sdie'){
    const f=s.face;let b;
    if(!mine)b=wait;
    else if(f===3)b='<div class="btns">'+B('truth3','Draw a Level 3 Truth','deck',null,'--c:'+DECKS.truth.c)+B('next','Drink 3 sips instead','alt')+'</div>';
    else if(f===2)b='<div class="btns">'+B('next','Done')+safeB+'</div>';
    else b=nextB();
    return {c:'#16A34A',k:W,icon:'die',title:'Special Die',sub:p.name+' rolled '+f,isNew:isNew,sdie:true,
      body:'<div class="sdie">'+dieHTML(f,isNew?'spin':'')+'<p class="big-q">'+f+'. '+esc(SDIE[f])+'</p></div>'+b,say:'Special Die: '+SDIE[f]};
  }
  if(s.kind==='win'){
    const w=g.players[g.winner];
    let b='';
    if(canWinner(g))b+='<div class="btns">'+B('final','Draw a last Dare','deck',null,'--c:'+DECKS.dare.c)+'</div>';
    if(canHost(g))b+='<div class="btns">'+B('restart','Play again')+(mode==='local'?B('home','Back to the start','alt'):'')+'</div>';
    else b+='<p class="wait">Waiting for the host to start a new round.</p>';
    return {c:TYPES.end.c,k:K,icon:'trophy',title:w.name+' wins!',sub:'Square 54 · End',isNew:isNew,
      body:'<p class="lead">'+esc(w.name)+' picks one player to finish their drink, or gives one last Dare.</p>'+b,say:w.name+' wins!'};
  }
  if(s.kind==='final'){
    const w=g.players[g.winner];const text=DECKS.dare.cards[s.level][s.idx];
    return {c:DECKS.dare.c,k:W,icon:'flame',title:'Last Dare',sub:w.name+' gives it to someone',flip:true,isNew:isNew,
      body:cardHTML('dare',s.level,esc(text),DECKS.dare.foot,!isNew)+(canHost(g)?'<div class="btns">'+B('restart','Play again')+(mode==='local'?B('home','Back to the start','alt'):'')+'</div>':'<p class="wait">Waiting for the host to start a new round.</p>'),say:text};
  }
  return null;
}
function paintSheet(){
  const old=document.querySelector('.scrim.game');
  const lowerWasChecked=!!(document.getElementById('lower')&&document.getElementById('lower').checked);
  const v=G?sheetView(G):null;
  if(!v){if(old)old.remove();sheetKey='';return;}
  const key=G.sheet.n+':'+G.sheet.kind;
  const fresh=key!==sheetKey;
  const el=document.createElement('div');el.className='scrim game'+(fresh?' fresh':'');
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" style="--c:'+v.c+';--k:'+(v.k||W)+'">'+
    '<div class="sh-head"><span class="ic">'+svg(v.icon)+'</span><div><h2 class="sh-title" id="sh-t">'+esc(v.title)+'</h2>'+(v.sub?'<div class="sh-sub">'+esc(v.sub)+'</div>':'')+'</div></div>'+
    '<div class="sh-body">'+v.body+'</div></div>';
  if(old)old.replaceWith(el);else document.body.appendChild(el);
  if(!fresh&&lowerWasChecked){const l=document.getElementById('lower');if(l)l.checked=true;}
  if(fresh){
    sheetKey=key;
    const first=el.querySelector('.sh-body button');if(first)first.focus({preventScroll:true});
    if(v.say)say(v.say);
  }
  if(v.flip&&v.isNew){
    seenSheet=G.sheet.n;
    const f=el.querySelector('#flip');
    if(f){if(reduced)f.classList.add('open');else requestAnimationFrame(function(){requestAnimationFrame(function(){f.classList.add('open');});});}
  }else if(G.sheet){seenSheet=G.sheet.n;}
}
function showMenu(){
  closeMenu();
  const el=document.createElement('div');el.className='scrim menu fresh';
  let b='';
  if(mode==='online'){
    b+='<p class="note">Game code <b>'+esc(code)+'</b>. Friends who join now can watch; they play from the next round.</p>';
    if(canHost(G)){
      if(G.status==='play')b+='<div class="btns">'+B('skip','Skip '+G.players[actor(G)].name+"'s turn",'alt')+'</div>';
      b+='<div class="btns">'+B('restart','Restart with the same players','alt')+B('relobby','Back to the lobby (new players)','alt')+'</div>';
    }
    b+='<div class="btns">'+B('leave','Leave this game','alt')+B('closemenu','Back to the game')+'</div>';
  }else{
    b+='<div class="btns">'+B('restart','Restart with the same players','alt')+B('local-setup','Change players or level','alt')+'</div>'+
       '<div class="btns">'+B('home','Back to the start','alt')+B('closemenu','Back to the game')+'</div>';
  }
  el.innerHTML='<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mn-t" style="--c:#62656B;--k:#FFFFFF"><div class="sh-head"><span class="ic">'+svg('menu')+'</span><div><h2 class="sh-title" id="mn-t">Game menu</h2></div></div><div class="sh-body">'+b+'</div></div>';
  document.body.appendChild(el);
  const f=el.querySelector('button');if(f)f.focus({preventScroll:true});
}
function closeMenu(){const m=document.querySelector('.scrim.menu');if(m)m.remove();}

/* ================= online plumbing ================= */
function stopOnline(){
  if(unsubGame){unsubGame();unsubGame=null;}
  if(unsubSeats){unsubSeats();unsubSeats=null;}
  clearTimeout(loadTimer);seats=[];
}
function enterOnline(c){
  stopOnline();
  mode='online';code=c;G=null;firstState=true;seenSheet=0;sheetKey='';
  lsSet(ONLINE_KEY,{code:c});
  renderLoading();
  loadTimer=setTimeout(function(){const m=document.getElementById('load-msg');if(m)m.textContent="Can't reach the game yet. Check your connection; it will load as soon as it can.";},10000);
  const ref=db.doc('games/'+c);
  unsubGame=ref.onSnapshot(function(snap){
    if(!snap.metadata.fromCache)clearTimeout(loadTimer);
    if(!snap.exists){if(!snap.metadata.fromCache){toast('Game '+c+' no longer exists.');leave();}return;}
    onState(snap.data());
  },function(err){
    clearTimeout(loadTimer);
    const m=document.getElementById('load-msg');
    if(m)m.textContent=err&&err.code==='revoked'?'Access to this page changed. Reopen it to keep playing.':"Lost the connection to the game. Reopen the page to reconnect.";
    else toast("Lost the connection to the game. Reopen the page to reconnect.");
  });
  unsubSeats=ref.collection('seats').onSnapshot(function(qs){
    seats=qs.docs.map(function(d){const x=d.data()||{};return {id:d.id,name:x.name,joined:x.joined};});
    if(G&&G.status==='lobby'&&!animating)renderLobby();
  },function(){});
}
function leave(){
  stopOnline();lsSet(ONLINE_KEY,null);
  mode=null;code=null;G=null;closeSheet();closeMenu();ui.msg='';
  renderHome();
}
function nick(){const n=String(ui.nick||'').trim();return n||'Player';}
async function createGame(){
  if(!db||!me||busy)return;
  busy=true;ui.msg='Creating the game…';ui.msgOk=true;renderHome();
  try{
    let c=genCode();
    for(let i=0;i<6;i++){const s=await db.doc('games/'+c).get();if(!s.exists)break;c=genCode();}
    const g={v:2,code:c,host:me,status:'lobby',level:ui.level,order:[],players:{},turn:0,boost:false,decks:{},rev:1,anim:null,sheet:null,note:null,winner:null,created:Date.now()};
    await db.doc('games/'+c).set(g);
    await db.doc('games/'+c+'/seats/'+me).set({name:nick(),joined:Date.now()});
    busy=false;ui.msg='';enterOnline(c);
  }catch(e){
    busy=false;ui.msgOk=false;
    ui.msg=e&&e.code==='invalid_argument'?"Couldn't create the game: you need Editor access to this page.":"Couldn't create the game. Check your connection and try again.";
    renderHome();
  }
}
async function joinGame(){
  if(!db||!me||busy)return;
  const c=String(ui.joinCode||'').toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4){ui.msg='Type the 4-letter code your host sees.';ui.msgOk=false;renderHome();return;}
  busy=true;ui.msg='Looking for game '+c+'…';ui.msgOk=true;renderHome();
  try{
    const s=await db.doc('games/'+c).get();
    if(!s.exists){busy=false;ui.msg='No game found with code '+c+'.';ui.msgOk=false;renderHome();return;}
    const g=s.data();
    if(g.status==='lobby'){
      try{await db.doc('games/'+c+'/seats/'+me).set({name:nick(),joined:Date.now()});}
      catch(e){toast(e&&e.code==='invalid_argument'?"You can watch, but you need Editor access to this page to play.":"Couldn't take a seat. You're watching for now.");}
    }else if(!(g.players&&g.players[me])){toast('This game already started. You can watch, and play from the next round.');}
    busy=false;ui.msg='';enterOnline(c);
  }catch(e){busy=false;ui.msg="Couldn't reach game "+c+'. Check your connection and try again.';ui.msgOk=false;renderHome();}
}
function startOnline(){
  if(!G||G.host!==me||busy)return;
  const list=seats.slice().sort(function(a,b){return (a.joined||0)-(b.joined||0);}).slice(0,10);
  if(list.length<2)return;
  const g=newGame(list.map(function(s){return s.id;}),list.map(function(s){return String(s.name||'Player').slice(0,16);}),G.level,
    {code:G.code,host:G.host,created:G.created,rev:(G.rev||0)+1});
  g.note={n:g.rev,text:"Let's go! "+g.players[g.order[0]].name+' starts.'};
  commit(g);
}
async function backToLobby(){
  if(!G||G.host!==me)return;
  const g=clone(G);g.rev=(g.rev||0)+1;g.status='lobby';g.sheet=null;g.anim=null;g.winner=null;g.order=[];g.players={};
  await commit(g);
  try{await db.doc('games/'+code+'/seats/'+me).set({name:nick(),joined:Date.now()});}catch(e){}
}

/* ================= events ================= */
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='nick'){ui.nick=t.value;lsSet(NICK_KEY,t.value);}
  else if(t.id==='jcode'){ui.joinCode=t.value.toUpperCase();}
  else if(t.matches('.prow input')){ui.draft.names[+t.dataset.i]=t.value;}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='jcode'){e.preventDefault();joinGame();}
  if(e.key==='Escape')closeMenu();
});
document.addEventListener('click',function(e){
  const a=e.target.closest('[data-act]');
  if(!a){if(e.target.classList&&e.target.classList.contains('menu'))closeMenu();return;}
  if(a.disabled)return;
  const k=a.dataset.act,arg=a.dataset.arg;
  switch(k){
    case 'olvl':ui.level=+arg;renderHome();break;
    case 'create':createGame();break;
    case 'join':joinGame();break;
    case 'local-setup':{
      const wasLocal=mode==='local'&&G&&G.order;
      if(wasLocal){ui.draft.names=G.order.map(function(id){return G.players[id].name;});ui.draft.level=G.level;}
      closeMenu();closeSheet();if(mode==='online')leave();
      mode='local';ui.screen='local-setup';G=null;renderLocalSetup();break;}
    case 'continue-local':{const g=lsGet(LOCAL_KEY);if(!g)break;mode='local';ui.screen='game';G=null;firstState=true;sheetKey='';onState(g);break;}
    case 'llvl':ui.draft.level=+arg;renderLocalSetup();break;
    case 'add':ui.draft.names.push('Player '+(ui.draft.names.length+1));renderLocalSetup();{const ins=document.querySelectorAll('.prow input');ins[ins.length-1].focus();}break;
    case 'rm':ui.draft.names.splice(+arg,1);renderLocalSetup();break;
    case 'start-local':{
      const names=ui.draft.names.map(function(n,i){n=String(n).trim();return n||('Player '+(i+1));});
      const g=newGame(names.map(function(_,i){return 'p'+i;}),names,ui.draft.level,{mode:'local'});
      g.note={n:1,text:names[0]+' starts.'};
      mode='local';ui.screen='game';firstState=false;seenNote=0;seenAnim=0;seenSheet=0;sheetKey='';
      lsSet(LOCAL_KEY,g);G=g;paint();break;}
    case 'home':closeMenu();closeSheet();if(mode==='online'){leave();break;}mode=null;G=null;ui.screen='home';renderHome();break;
    case 'leave':closeMenu();leave();break;
    case 'start-online':startOnline();break;
    case 'relobby':closeMenu();backToLobby();break;
    case 'menu':showMenu();break;
    case 'closemenu':closeMenu();break;
    case 'tile':{const n=+arg;toast('Square '+n+' · '+TYPES[BOARD[n-1]].label);break;}
    case 'roll':act('roll');break;
    case 'next':act('next');break;
    case 'pass':act('pass');break;
    case 'usesafe':act('safe');break;
    case 'tod':{const l=document.getElementById('lower');act('tod',arg,!!(l&&l.checked));break;}
    case 'truth3':act('truth3');break;
    case 'sdraw':act('special');break;
    case 'sroll':act('sdie');break;
    case 'jump':act('move',+arg);break;
    case 'back3':act('move',-3);break;
    case 'swap':act('swap',arg);break;
    case 'drop':act('drop',a.dataset.id,arg);break;
    case 'final':act('final');break;
    case 'restart':closeMenu();act('restart');break;
    case 'skip':closeMenu();act('skip');break;
  }
});
window.addEventListener('resize',function(){if(G&&G.status!=='lobby'&&mode)refreshBoard();});

/* ================= boot ================= */
async function connect(){
  if(!(window.claude&&window.claude.use)){platform='off';if(mode===null)renderHome();return;}
  try{
    const res=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    db=res[0];user=res[1];
    if(user){me=await user.id();try{canWrite=await user.can('data.write');}catch(e){canWrite=null;}
      if(!ui.nick){try{const m=await user.me();if(m&&m.name){ui.nick=m.name.split(' ')[0].slice(0,16);}}catch(e){}}}
    platform=db?'on':'off';
  }catch(e){platform='off';}
  const saved=lsGet(ONLINE_KEY);
  if(platform==='on'&&me&&saved&&saved.code&&mode===null){enterOnline(saved.code);return;}
  if(mode===null)renderHome();
}
function start(data){
  if(data&&data.mode==='local'&&data.local){mode='local';ui.screen='game';G=null;firstState=true;onState(data.local);}
  else renderHome();
  if(PORTABLE){platform='off';return;}
  connect();
}
try{if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(function(){return {mode:mode,local:mode==='local'?G:null};});}catch(e){}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);
else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
})();
</script>
